<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Supply Chain CRM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#fafaf8;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.14);
  --text:#000000;--text2:#000000;--text3:#000000;
  --accent:#1a5c3a;--accent-light:#edf5f0;
  --ok:#225034;--ok-bg:#f0fdf4;--ok-b:#bbf7d0;
  --warn:#92400e;--warn-bg:#fffbeb;--warn-b:#fde68a;
  --danger:#991b1b;--danger-bg:#fef2f2;--danger-b:#fecaca;
  --gray:#374151;--gray-bg:#f9fafb;--gray-b:#e5e7eb;
  --info:#1e40af;--info-bg:#eff6ff;--info-b:#bfdbfe;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;height:100vh;overflow:hidden}
.shell{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden;transition:width .25s ease}
.sidebar.collapsed{width:52px}
.sidebar.collapsed .s-logo-text,.sidebar.collapsed .s-sec,.sidebar.collapsed .nav-label,.sidebar.collapsed .s-foot-inner,.sidebar.collapsed .s-toggle-label{display:none}
.sidebar.collapsed .nav,.sidebar.collapsed .s-toggle{justify-content:center;padding-left:0;padding-right:0}
.sidebar.collapsed .nav-l,.sidebar.collapsed .s-logo{justify-content:center}
.s-toggle{position:sticky;top:0;z-index:10;width:100%;padding:6px 10px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;color:#000;font-weight:500;user-select:none;transition:background .15s}
.s-toggle:hover{background:var(--accent-light);color:var(--accent)}
.s-toggle-icon{width:24px;height:24px;border-radius:6px;background:var(--bg);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:all .2s}
.s-toggle:hover .s-toggle-icon{background:var(--accent);color:#fff;border-color:var(--accent)}
.s-logo{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.s-logo-icon{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.s-logo-text h1{font-size:13px;font-weight:600;color:var(--accent)}
.s-logo-text p{font-size:10px;color:#000;margin-top:1px}
.s-sec{padding:10px 12px 3px;font-size:10px;font-weight:600;color:#000;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap}
.nav{display:flex;align-items:center;padding:7px 10px;margin:1px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:#000;transition:background .1s;user-select:none}
.nav:hover{background:var(--bg);color:#000}
.nav.on{background:var(--accent-light);color:var(--accent);font-weight:500}
.nav-l{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.s-foot{margin-top:auto;border-top:1px solid var(--border)}
.s-foot-inner{padding:10px 14px}
.s-foot .conn-status-bar{display:flex;align-items:center;gap:7px;padding:7px 0}
.s-foot .conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#d1d5db}
.s-foot .conn-dot.ok{background:#16a34a}
.s-foot .conn-dot.err{background:#dc2626}
.s-foot .conn-dot.loading{background:#d97706;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.s-foot .conn-text{font-size:11px;color:#000;font-weight:500}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-scroll{flex:1;overflow-y:auto}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:10}
.tb-l{display:flex;align-items:center;gap:8px}
.tb-r{display:flex;gap:6px;align-items:center}
.tb-title{font-size:15px;font-weight:700;letter-spacing:-.2px;color:#000}
.crumb{display:flex;align-items:center;gap:4px;font-size:13px}
.crumb .cl{color:#000;cursor:pointer;font-weight:500}
.crumb .cl:hover{color:var(--accent);text-decoration:underline}
.crumb .cc{color:#000;font-weight:600}
.crumb .sep{color:#000}

/* PIPELINE BAR */
.pipeline-bar{background:var(--surface);border-bottom:2px solid var(--border);padding:0 18px;display:flex;align-items:stretch;overflow-x:auto;flex-shrink:0;min-height:44px}
.pipe-step{display:flex;align-items:center;flex-shrink:0}
.pipe-node{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;cursor:pointer;transition:background .12s;white-space:nowrap;position:relative}
.pipe-node:hover{background:var(--bg)}
.pipe-node.active{background:var(--accent-light)}
.pipe-node.active::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;background:var(--accent)}
.pipe-node.dimmed{opacity:.4;cursor:default}
.pipe-node.dimmed:hover{background:transparent}
.pipe-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;border:2px solid}
.pdq{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-b)}
.pdpo{background:var(--info-bg);color:var(--info);border-color:var(--info-b)}
.pdpoi{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
.pdoem{background:#f5f3ff;color:#7c3aed;border-color:#ddd6fe}
.pdcs{background:#fff1f2;color:#be123c;border-color:#fecdd3}
.pipe-dot.active{transform:scale(1.12)}
.pipe-label-main{font-size:12px;font-weight:700;color:#000}
.pipe-label-sub{font-size:10px;color:#000}
.pipe-node.active .pipe-label-main{color:var(--accent)}
.pipe-arr{color:var(--border2);font-size:16px;flex-shrink:0;padding:0 2px;display:flex;align-items:center;user-select:none}

/* TAB BAR */
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;flex-shrink:0}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:#000;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .1s}
.tab:hover{color:#000}
.tab.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:#000;transition:all .1s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#1d6b44}
.btn-add{background:#16a34a;color:#fff;border-color:#16a34a}
.btn-add:hover{background:#15803d}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-xs{padding:3px 9px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent;color:#000}
.btn-ghost:hover{background:var(--bg);color:#000}
.btn-off{opacity:.38;cursor:not-allowed;pointer-events:none}

.accept-tick{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--ok-bg);border:1.5px solid var(--ok-b);color:var(--ok);font-size:12px;cursor:pointer;transition:all .15s;flex-shrink:0;font-weight:700;line-height:1}
.accept-tick:hover{background:var(--accent);border-color:var(--accent);color:#fff;transform:scale(1.15)}

.s-input{max-width:260px;padding:6px 10px;border:1px solid var(--border2);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#000;background:var(--bg);outline:none}
.s-input:focus{border-color:var(--accent);background:#fff}
.f-select{padding:6px 8px;border:1px solid var(--border2);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#000;background:var(--bg);outline:none;cursor:pointer}

/* TABLES */
.t-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:9px 10px;text-align:left;font-size:12px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.5px;background:var(--surface2);white-space:nowrap;border:1px solid var(--border)}
tbody td{padding:8px 10px;color:#000;vertical-align:middle;border:1px solid var(--border);background:#fff}
thead th:first-child,tbody td:first-child{width:36px;text-align:center;padding:0 8px}
tbody tr:hover td{background:var(--surface2)}
tbody tr.sel td,tbody tr.sub-editing td,tbody tr.row-editing td{background:#f0f7f3}
tbody tr.poi-row-selected td{background:var(--accent-light)!important;border-left:3px solid var(--accent)}
.cb{width:13px;height:13px;cursor:pointer;accent-color:var(--accent)}
.bulk-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--accent-light);border-bottom:1px solid var(--ok-b);font-size:13px;color:#000;font-weight:600}

/* INLINE EDIT */
.ie-input{padding:3px 6px;border:1px solid var(--accent);border-radius:4px;font-size:13px;font-family:'DM Sans',sans-serif;width:100%;min-width:70px;outline:none;background:#fff;color:#000}
.ie-select{padding:3px 5px;border:1px solid var(--accent);border-radius:4px;font-size:13px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;color:#000;width:100%}
.ie-actions{display:inline-flex;gap:3px;vertical-align:middle}

/* RECORD DETAIL */
.empty{text-align:center;padding:28px 16px;color:#000;font-size:13px}
.rec-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px}
.rec-id-row{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.rec-id{font-size:19px;font-weight:700;letter-spacing:-.4px;font-family:'DM Mono',monospace;color:#000}
.rec-meta{font-size:13px;color:#000;font-weight:500}
.rec-meta span{margin-right:12px}
.rec-body{padding:14px 18px;display:flex;flex-direction:column;gap:14px}
.section{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sec-hdr{padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sec-title{font-size:13px;font-weight:700;color:#000}
.hint{font-size:12px;color:#000;font-style:italic;padding:7px 12px;background:var(--surface2);border-bottom:1px solid var(--border)}
.chip-clr{padding:2px 8px;border-radius:20px;border:1px solid var(--ok-b);background:var(--ok-bg);font-size:12px;font-weight:600;cursor:pointer;color:var(--accent);transition:all .1s}
.chip-clr:hover{background:var(--accent);color:#fff}

/* POI SELECTED PANEL */
.poi-selected-panel{background:var(--surface);border:2px solid var(--ok-b);border-radius:8px;overflow:hidden;margin-top:0}
.poi-panel-header{padding:10px 14px;background:var(--ok-bg);border-bottom:1px solid var(--ok-b);display:flex;align-items:center;justify-content:space-between;gap:8px}
.poi-panel-title{font-size:13px;font-weight:700;color:#000;display:flex;align-items:center;gap:6px}
.poi-panel-close{cursor:pointer;color:#000;font-size:14px;padding:2px 6px;border-radius:4px;transition:background .1s}
.poi-panel-close:hover{background:var(--border);color:#000}
.sub-table-section{border-bottom:2px solid var(--ok-b)}
.sub-table-section:last-child{border-bottom:none}
.sub-tables-wrapper{display:flex;flex-direction:column;gap:16px;padding:16px}
.sub-table-block{background:var(--surface);border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.sub-table-hdr{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sub-table-title{font-size:13px;font-weight:700;color:#000;display:flex;align-items:center;gap:6px}

/* BADGES & TAGS */
.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-b)}
.b-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-b)}
.b-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-b)}
.b-gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-b)}
.b-info{background:var(--info-bg);color:var(--info);border-color:var(--info-b)}
.tag{display:inline-flex;align-items:center;padding:1px 6px;border-radius:4px;font-size:12px;font-family:'DM Mono',monospace;font-weight:600;background:var(--surface2);border:1px solid var(--border2);color:#000;white-space:nowrap}
.id-link{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
.id-link:hover{text-decoration:underline}
.mono{font-family:'DM Mono',monospace;font-size:13px;color:#000}
.prog-w{display:flex;align-items:center;gap:5px}
.prog{width:60px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}
.pf{height:100%;border-radius:2px}
.pf-ok{background:#16a34a}.pf-warn{background:#d97706}.pf-danger{background:#dc2626}.pf-0{background:#d1d5db}

/* MODAL */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.14)}
.m-hdr{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.m-hdr h2{font-size:15px;font-weight:700;color:#000}
.m-body{padding:16px 18px}
.m-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:7px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.f-full{grid-column:span 2}
.f-full3{grid-column:span 3}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label{font-size:11px;font-weight:700;color:#000;text-transform:uppercase;letter-spacing:.4px}
.fgrp input,.fgrp select,.fgrp textarea{padding:7px 9px;border:1px solid var(--border2);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#000;background:var(--surface);outline:none;transition:border .1s;width:100%}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(26,92,58,.08)}
.fgrp input[readonly]{background:var(--surface2);color:#000;cursor:default}
.fgrp textarea{resize:vertical;min-height:56px}
.id-gen{font-family:'DM Mono',monospace;font-size:13px;padding:7px 9px;background:var(--accent-light);color:var(--accent);border:1px solid var(--ok-b);border-radius:6px;font-weight:600}
.form-section-title{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;padding:6px 0 2px;border-bottom:1px solid var(--accent-light);margin-bottom:4px;grid-column:span 2}

/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;z-index:999;background:var(--text);color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:all .3s}
.toast.hide{opacity:0;transform:translateY(8px);pointer-events:none}

/* empty cell dash */
.dash{color:#000;font-size:12px}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="s-toggle" onclick="toggleSidebar()">
    <div class="s-toggle-icon" id="tog-icon">◀</div>
    <span class="s-toggle-label">Collapse</span>
  </div>
  <div class="s-logo">
    <div class="s-logo-icon">SC</div>
    <div class="s-logo-text"><h1>Supply Chain</h1><p>Live — Google Sheets</p></div>
  </div>
  <div class="s-sec">Quotations</div>
  <div class="nav on" onclick="switchTab('SE')"  id="nav-SE" ><div class="nav-l"><span class="dot" style="background:#166534"></span><span class="nav-label">Shree Quotation</span></div></div>
  <div class="nav"    onclick="switchTab('SRE')" id="nav-SRE"><div class="nav-l"><span class="dot" style="background:#92400e"></span><span class="nav-label">Shree Service Qtn</span></div></div>
  <div class="nav"    onclick="switchTab('BO')"  id="nav-BO" ><div class="nav-l"><span class="dot" style="background:#1e40af"></span><span class="nav-label">Budgetary Offer</span></div></div>
  <div class="nav"    onclick="switchTab('AQ')"  id="nav-AQ" ><div class="nav-l"><span class="dot" style="background:#6b21a8"></span><span class="nav-label">Techno Quotation</span></div></div>
  <div class="s-sec">Orders</div>
  <div class="nav"    onclick="switchTab('PO')"  id="nav-PO" ><div class="nav-l"><span class="dot" style="background:#374151"></span><span class="nav-label">Purchase Orders</span></div></div>
  <div class="nav"    onclick="switchTab('POI')" id="nav-POI"><div class="nav-l"><span class="dot" style="background:#374151"></span><span class="nav-label">PO Items</span></div></div>
  <div class="s-sec">Supply</div>
  <div class="nav"    onclick="switchTab('OEM')" id="nav-OEM"><div class="nav-l"><span class="dot" style="background:#374151"></span><span class="nav-label">OEM Supply</span></div></div>
  <div class="nav"    onclick="switchTab('CS')"  id="nav-CS" ><div class="nav-l"><span class="dot" style="background:#374151"></span><span class="nav-label">Customer Supply</span></div></div>
  <div class="s-foot">
    <div class="s-foot-inner">
      <div class="conn-status-bar">
        <div class="conn-dot loading" id="conn-dot"></div>
        <span class="conn-text" id="conn-text">Connecting…</span>
      </div>
    </div>
  </div>
</aside>
<div class="main"><div class="main-scroll" id="main"></div></div>
</div>

<div class="backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="m-hdr"><h2 id="m-title">Form</h2><button class="btn btn-ghost btn-sm" style="padding:4px 8px;font-size:15px" onclick="closeModal()">✕</button></div>
    <div class="m-body" id="m-body"></div>
    <div class="m-foot"><button class="btn btn-sm" onclick="closeModal()">Cancel</button><button class="btn btn-add btn-sm" onclick="saveForm()">Save</button></div>
  </div>
</div>
<div class="toast hide" id="toast"></div>

<script>
// ── BACKEND CONFIG (hardcoded — never shown in UI) ─────────────────────────
const SHEET_ID = '1npOMka5bQ_OuJGSLdYiwFjK0DqeE3-TyE_k7j_ctwbw';
const API_KEY  = 'YOUR_GOOGLE_API_KEY_HERE'; // Replace with your real API key

// ── DATE UTILS ─────────────────────────────────────────────────────────────
function pad(n){return String(n).padStart(2,'0')}
function todayDMY(){const d=new Date();return pad(d.getDate())+'-'+pad(d.getMonth()+1)+'-'+d.getFullYear()}
function isoToDMY(v){if(!v)return'';if(/^\d{2}-\d{2}-\d{4}$/.test(v))return v;const p=v.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:v}
function dmyToISO(v){if(!v)return'';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;const p=v.split('-');return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:v}

// ── ID FORMAT GENERATORS ───────────────────────────────────────────────────
function nextQuotId(type, arr){
  const prefixMap = {SE:'SE QID', SRE:'SER QID', BO:'BO ID', AQ:'TE QID'};
  const prefix = prefixMap[type] || type;
  const max = arr.length ? Math.max(...arr.map(r=>{
    const parts = (r.id||'').split('-');
    return parseInt(parts[parts.length-1])||0;
  })) : 0;
  return `${prefix}-${max+1}`;
}

// ── STATE ──────────────────────────────────────────────────────────────────
let DB={SE:[],SRE:[],BO:[],AQ:[],PO:[],POI:[],OEM:[],CS:[]};
let isConnected = false;
let viewMode='list';
let curTab='SE', curRec=null, curType=null;
let selPO=null, selPOI=null;
let sq='', sf='all', formCtx=null;
let selectedRows=new Set();
let editingRow=null, subEditingRow=null;

// ── SIDEBAR ────────────────────────────────────────────────────────────────
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const col=sb.classList.toggle('collapsed');
  document.getElementById('tog-icon').textContent=col?'▶':'◀';
  const lbl=sb.querySelector('.s-toggle-label');
  if(lbl)lbl.textContent=col?'Expand':'Collapse';
}

// ── CONNECTION STATUS ──────────────────────────────────────────────────────
function setConnStatus(state, msg){
  const dot=document.getElementById('conn-dot');
  const txt=document.getElementById('conn-text');
  if(!dot||!txt)return;
  dot.className='conn-dot';
  if(state==='ok'){dot.classList.add('ok');isConnected=true;}
  else if(state==='err'){dot.classList.add('err');isConnected=false;}

// ── LOAD ALL DATA FROM SHEETS ─────────────────────────────────────────────
async function loadAllData(){
  setConnStatus('loading','Connecting…');
  try{
    for(const name of Object.keys(HEADERS)){
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${name}?key=${API_KEY}`;
      const res=await fetch(url);
      if(!res.ok){
        const errData=await res.json().catch(()=>({}));
        throw new Error(`Sheet "${name}": ${errData.error?.message||res.status}`);
      }
      const json=await res.json();
      const rows=(json.values)||[];
      if(rows.length<2){DB[name]=[];continue;}
      const headers=rows[0];
      const map=FIELD_MAP[name]||{};
      DB[name]=rows.slice(1).map(r=>{
        const o={};
        headers.forEach((h,i)=>{
          const key=map[h]||h;
          o[key]=r[i]!==undefined?r[i]:'';
        });
        // numeric coercions
        if(name==='POI')o.orderedQty=+o.orderedQty||0;
        if(name==='OEM')o.qtyReceived=+o.qtyReceived||0;
        if(name==='CS') o.qtySupplied=+o.qtySupplied||0;
        return o;
      }).filter(o=>o.id); // skip empty rows
    }
    setConnStatus('ok','Connected ✓');
    toast('Sheet data loaded');
    render();
  }catch(e){
    setConnStatus('err','Error: '+e.message);
    toast('Connection failed — loading demo data');
    loadDemo();
  }
}

        const res=await fetch(url);
        if(!res.ok)continue;
        const json=await res.json();
        const rows=(json.values)||[];
        if(rows.length<2){DB[name]=[];continue;}
        const headers=rows[0];
        const map=FIELD_MAP[name]||{};
        DB[name]=rows.slice(1).map(r=>{
          const o={};
          headers.forEach((h,i)=>{const key=map[h]||h;o[key]=r[i]!==undefined?r[i]:'';});
          if(name==='POI')o.orderedQty=+o.orderedQty||0;

// ── APPEND ROW ─────────────────────────────────────────────────────────────
async function appendRow(name,data){
  // Always update local DB first for instant UI
  DB[name].push(data);
  render();
  if(!isConnected)return;
  const row=HEADERS[name].map(h=>{
    // reverse map: header → key
    const map=FIELD_MAP[name]||{};
    const key=map[h]||h;
    return data[key]!==undefined?String(data[key]):'';
  });
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${name}:append?valueInputOption=USER_ENTERED&key=${API_KEY}`;
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[row]})});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Append failed')}
}

// ── UPDATE ROW ─────────────────────────────────────────────────────────────
async function updateRow(name,data){
  const idx=DB[name].findIndex(r=>r.id===data.id);
  if(idx<0)return;
  // Optimistic local update
  DB[name][idx]=data;
  render();
  if(!isConnected)return;
  const row=HEADERS[name].map(h=>{
    const map=FIELD_MAP[name]||{};
    const key=map[h]||h;
    return data[key]!==undefined?String(data[key]):'';
  });
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${name}!A${idx+2}?valueInputOption=USER_ENTERED&key=${API_KEY}`;
  const res=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({values:[row]})});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||'Update failed')}
}

function readFields(obj,attr){
  document.querySelectorAll(`[${attr}-field]`).forEach(el=>{
    const f=el.getAttribute(`${attr}-field`);
    let v=el.value;

    if(['orderedQty','poValue','qtyReceived','qtySupplied','gemAMCPaymentAmount'].includes(f))v=+v||0;
    obj[f]=v;
  });
  return obj;
}

  </div>${arr}</div>`}
  function nodeNoArr(dotCls,active,dimmed,main,sub,click){return`<div class="pipe-step"><div class="pipe-node${active?' active':dimmed?' dimmed':''}" ${click?`onclick="${click}"`:''}>
    <div class="pipe-dot ${dotCls}${active?' active':''}"></div>
    <div><div class="pipe-label-main">${main}</div><div class="pipe-label-sub">${sub}</div></div>
  </div></div>`}
  let h=`<div class="pipeline-bar">`;
  if(quot)h+=node('pdq',viewMode==='quot'&&!poId&&!poiId,false,quotId,`${quotType}·${quot.customerName||''}`,`openQuot('${quotType}','${esc(quotId)}')`);
  if(po)h+=node('pdpo',viewMode==='po'&&!poiId,false,poId,`${po.customerName||po.sePONum||''}`,`openPO('${poId}')`);
  else if(allPOs.length)h+=node('pdpo',false,true,`${allPOs.length} PO${allPOs.length>1?'s':''}`,`Select PO to focus`,'');
  if(allPOIs.length)h+=node('pdpoi',false,true,`${allPOIs.length} Item${allPOIs.length>1?'s':''}`,`Click POI row to open`,'');
  h+=node('pdoem',false,!oemCnt,`${oemCnt} OEM Receipt${oemCnt!==1?'s':''}`,oemCnt?'From OEM supplier':'No receipts yet','');
  h+=nodeNoArr('pdcs',false,!csCnt,`${csCnt} Dispatch${csCnt!==1?'es':''}`,csCnt?'To customer':'No dispatches yet','');
  return h+`</div>`;
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  const m=document.getElementById('main');if(!m)return;
  if(viewMode==='quot')m.innerHTML=rQuot();
  else if(viewMode==='po')m.innerHTML=rPO();
  else m.innerHTML=rTable();
}

// ── LABEL MAPS ─────────────────────────────────────────────────────────────
const LABELS={SE:'Shree Quotation',SRE:'Shree Service Quotation',BO:'Budgetary Offer',AQ:'Techno Quotation',PO:'Purchase Orders',POI:'PO Line Items',OEM:'OEM Supply',CS:'Customer Supply'};
const STAT_OPTS={SE:['Pending','Accepted','Rejected'],SRE:['Pending','Accepted','Rejected'],BO:['Pending','Accepted','Rejected'],AQ:['Pending','Accepted','Rejected'],PO:['Open','Close'],POI:['Pending','Partial','Complete'],OEM:[],CS:[]};

// ── TABLE VIEW ─────────────────────────────────────────────────────────────
function rTable(){
  const rows=filterRows(curTab);
  const opts=STAT_OPTS[curTab]||[];
  const sfH=opts.length?`<select class="f-select" onchange="sf=this.value;render()"><option value="all">All status</option>${opts.map(o=>`<option value="${o}"${sf===o?' selected':''}>${o}</option>`).join('')}</select>`:'';
  const nSel=selectedRows.size;
  const allChk=rows.length>0&&rows.every(r=>selectedRows.has(r.id));
  let h=`<div class="topbar">
    <div class="tb-l"><span class="tb-title">${LABELS[curTab]}</span></div>
    <div class="tb-r">
      <input class="s-input" placeholder="Search…" value="${sq}" oninput="sq=this.value;render()"/>
      ${sfH}
      <button class="btn btn-add btn-sm" onclick="openForm('${curTab}')">+ New ${LABELS[curTab]}</button>
    </div>
  </div>
  <div class="tab-bar">${['SE','SRE','BO','AQ','PO','POI','OEM','CS'].map(t=>`<div class="tab${t===curTab?' on':''}" onclick="switchTab('${t}')">${LABELS[t]||t}</div>`).join('')}</div>`;
  if(nSel>0)h+=`<div class="bulk-bar"><span>${nSel} row${nSel>1?'s':''} selected</span><button class="btn btn-sm" onclick="selectedRows.clear();render()">✕ Clear</button></div>`;
  h+=`<div style="padding:14px 18px"><div class="section"><div class="t-wrap"><table><thead><tr>
    <th><input type="checkbox" class="cb" onchange="toggleSelectAll(this.checked)" ${allChk?'checked':''}></th>
    ${tHd(curTab)}</tr></thead><tbody>`;
  if(!rows.length)h+=`<tr><td></td><td colspan="40" class="empty">No records — click "+ New" to add</td></tr>`;
  else rows.forEach(r=>h+=tRow(curTab,r));
  return h+`</tbody></table></div></div></div>`;
}

// ── TOPBAR BUILDER ─────────────────────────────────────────────────────────
function topBarHTML(crumbItems,actions,pipe){
  const crumbs=crumbItems.map((c,i)=>i<crumbItems.length-1?`<span class="cl" onclick="${c.click}">${c.label}</span><span class="sep">›</span>`:`<span class="cc">${c.label}</span>`).join('');
  return`<div class="topbar"><div class="tb-l"><button class="btn btn-ghost btn-sm" onclick="goBack()">← Back</button><div class="crumb">${crumbs}</div></div><div class="tb-r">${actions}</div></div>${pipe||''}`;
}

// ── MODAL FORMS ────────────────────────────────────────────────────────────
function openForm(type,quotId,quotType,poId,poiId){
  formCtx={mode:'new',type,quotId:quotId||null,quotType:quotType||null,poId:poId||null,poiId:poiId||null};
  const titles={SE:'New Shree Quotation',SRE:'New Shree Service Quotation',BO:'New Budgetary Offer',AQ:'New Techno Quotation',PO:'New Purchase Order',POI:'New PO Line Item',OEM:'Record OEM Receipt',CS:'Record Customer Dispatch'};
  document.getElementById('m-title').textContent=titles[type]||'New';
  document.getElementById('m-body').innerHTML=buildForm(type,null,formCtx);
  document.getElementById('modal').style.display='flex';
}
function openEditForm(type,id){
  const rec=DB[type]?.find(r=>r.id===id);if(!rec)return;
  formCtx={mode:'edit',type,id};
  document.getElementById('m-title').textContent=`Edit ${id}`;
  document.getElementById('m-body').innerHTML=buildForm(type,rec,{});
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';formCtx=null}

function fi(id,label,val,type,placeholder,readonly){
  return`<div class="fgrp"><label>${label}</label><input type="${type||'text'}" id="${id}" value="${esc(val||'')}" ${readonly?'readonly':''} placeholder="${placeholder||''}"/></div>`;
}
function fs(id,label,val,opts){
  return`<div class="fgrp"><label>${label}</label><select id="${id}">${opts.map(o=>`<option value="${o}"${val===o?' selected':''}>${o}</option>`).join('')}</select></div>`;
}
function fd(id,label,val){
  return`<div class="fgrp"><label>${label}</label><input type="date" id="${id}" value="${dmyToISO(val||'')}"/></div>`;
}
function fta(id,label,val,cls){
  return`<div class="fgrp ${cls||'f-full'}"><label>${label}</label><textarea id="${id}">${esc(val||'')}</textarea></div>`;
}
function fsec(label){return`<div class="form-section-title">${label}</div>`;}

      <div class="fgrp"><label>Parent PO</label><select id="f-poId"><option value="">Select PO</option>${poOpts}</select></div>
      ${fi('f-itemName','Item Name',v('itemName'),'text','e.g. Steel pipe 20mm')}
      ${fta('f-itemDescription','Item Description / CAT No',v('itemDescription'),'f-full')}
      ${fi('f-orderedQty','Ordered Qty',v('orderedQty',1),'number','')}
      ${fi('f-uom','UOM',v('uom'),'text','e.g. Nos, Sets, Kg')}
      ${fta('f-oemDetails','OEM Details',v('oemDetails'),'f-full')}
      ${fi('f-oemInvoiceNo','OEM Invoice No.',v('oemInvoiceNo'),'text','Invoice number')}
      ${fd('f-oemInvoiceDate','OEM Invoice Date',v('oemInvoiceDate'))}
      ${fi('f-sePONo','SE PO NO',v('sePONo'),'text','SE PO number')}
      ${fi('f-seFileNo','SE File NO',v('seFileNo'),'text','SE File number')}
    </div>`;
  }
  if(type==='OEM'){
    const nid=nextId('OEM',DB.OEM);
    const poiId=ctx.poiId||'';
    const poi=poiId?DB.POI.find(p=>p.id===poiId):null;
    const poiOpts=DB.POI.filter(p=>!ctx.poId||p.poId===ctx.poId).map(p=>`<option value="${p.id}"${p.id===poiId?' selected':''}>${p.id} — ${p.itemName}</option>`).join('');
    return`<div class="fg">
      <div class="fgrp"><label>OEM ID</label><div class="id-gen">${nid}</div></div>
      ${fd('f-date','Date Received','')}
      <div class="fgrp f-full"><label>PO Line Item</label><select id="f-poiId" onchange="oemPOIChange(this.value)"><option value="">Select item</option>${poiOpts}</select></div>
      ${fi('f-supplier','OEM Supplier',poi?poi.oemDetails:'','text','OEM supplier name')}
      ${fi('f-itemName','Item',poi?poi.itemName:'','text','',true)}
      ${fi('f-qtyReceived','Qty Received','','number','Qty received')}
      ${fta('f-remarks','Remarks','')}
    </div>`;
  }
  if(type==='CS'){
    const nid=nextId('CS',DB.CS);
    const poiId=ctx.poiId||'';
    const poi=poiId?DB.POI.find(p=>p.id===poiId):null;
    const rcvd=poiId?oemRcvd(poiId):0,supp=poiId?csSupp(poiId):0,avail=rcvd-supp;
    const poiOpts=DB.POI.filter(p=>!ctx.poId||p.poId===ctx.poId).map(p=>`<option value="${p.id}"${p.id===poiId?' selected':''}>${p.id} — ${p.itemName}</option>`).join('');
    const oemOpts=DB.OEM.filter(o=>o.poiId===poiId).map(o=>`<option value="${o.id}">${o.id} (${o.qtyReceived} rcvd ${o.date})</option>`).join('');
    return`<div class="fg">
      <div class="fgrp"><label>CS ID</label><div class="id-gen">${nid}</div></div>
      ${fd('f-date','Date Dispatched','')}
      <div class="fgrp f-full"><label>PO Line Item</label><select id="f-poiId" onchange="csPOIChange(this.value)"><option value="">Select item</option>${poiOpts}</select></div>
      <div class="fgrp"><label>OEM Receipt Ref</label><select id="f-oemId"><option value="">Select receipt</option>${oemOpts}</select></div>
      ${fi('f-customer','Customer','','text','Customer name')}
      ${fi('f-itemName','Item',poi?poi.itemName:'','text','',true)}
      ${fi('f-avail','Available',avail+' units','text','',true)}
      ${fi('f-qtySupplied','Qty to Dispatch','','number','Max: '+avail)}
      ${fta('f-remarks','Remarks','')}
    </div>`;
  }
  return'';
}

function oemPOIChange(poiId){
  const poi=DB.POI.find(p=>p.id===poiId);if(!poi)return;
  const n=document.getElementById('f-itemName');if(n)n.value=poi.itemName;
  const s=document.getElementById('f-supplier');if(s)s.value=poi.oemDetails||'';
}
function csPOIChange(poiId){
  const poi=DB.POI.find(p=>p.id===poiId);if(!poi)return;
  document.getElementById('f-itemName').value=poi.itemName;
  const avail=oemRcvd(poiId)-csSupp(poiId);
  const q=document.getElementById('f-qtySupplied');if(q){q.max=avail;q.placeholder=`Max: ${avail}`}
  const a=document.getElementById('f-avail');if(a)a.value=`${avail} units`;
  const oe=document.getElementById('f-oemId');
  if(oe)oe.innerHTML=`<option value="">Select receipt</option>`+DB.OEM.filter(o=>o.poiId===poiId).map(o=>`<option value="${o.id}">${o.id} (${o.qtyReceived} rcvd ${o.date})</option>`).join('');
}

async function saveForm(){
  if(!formCtx)return;
  const{mode,type}=formCtx;
  const gv=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
  const gd=id=>isoToDMY(gv(id));
  let rec={};
  try{
    if(type==='SE'){
      if(!gv('f-customerName')){toast('Customer name required');return}
      rec={id:mode==='edit'?formCtx.id:nextQuotId('SE',DB.SE),session:gv('f-session'),seQtnNo:gv('f-seQtnNo'),seQtnDate:gd('f-seQtnDate'),customerName:gv('f-customerName'),customerRefNo:gv('f-customerRefNo'),kindAttention:gv('f-kindAttention'),enquiryDate:gd('f-enquiryDate'),enquiryDueDate:gd('f-enquiryDueDate'),oemName:gv('f-oemName'),makes:gv('f-makes'),itemDescription:gv('f-itemDescription'),orfNo:gv('f-orfNo'),sePoNo:gv('f-sePoNo'),seFileNo:gv('f-seFileNo'),remarks:gv('f-remarks'),status:gv('f-status')||'Pending'};
    }else if(type==='SRE'){
      if(!gv('f-customerName')){toast('Customer name required');return}
      rec={id:mode==='edit'?formCtx.id:nextQuotId('SRE',DB.SRE),session:gv('f-session'),serviceQtnNo:gv('f-serviceQtnNo'),serviceQtnDate:gd('f-serviceQtnDate'),customerName:gv('f-customerName'),customerRefNo:gv('f-customerRefNo'),kindAttention:gv('f-kindAttention'),enquiryDate:gd('f-enquiryDate'),itemDescription:gv('f-itemDescription'),qtyMandays:gv('f-qtyMandays'),uom:gv('f-uom'),totalPrice:gv('f-totalPrice'),poNo:gv('f-poNo'),remarks:gv('f-remarks'),status:gv('f-status')||'Pending'};
    }else if(type==='BO'){
      if(!gv('f-customerName')){toast('Customer name required');return}
      rec={id:mode==='edit'?formCtx.id:nextQuotId('BO',DB.BO),shreeBudgetaryNo:gv('f-shreeBudgetaryNo'),session:gv('f-session'),makes:gv('f-makes'),shreeBoDate:gd('f-shreeBoDate'),customerName:gv('f-customerName'),kindAttention:gv('f-kindAttention'),boEnquiryDate:gd('f-boEnquiryDate'),itemDescription:gv('f-itemDescription'),qty:gv('f-qty'),uom:gv('f-uom'),totalPrice:gv('f-totalPrice'),remark:gv('f-remark'),status:gv('f-status')||'Pending'};
    }else if(type==='AQ'){
      if(!gv('f-customerName')){toast('Customer name required');return}
      rec={id:mode==='edit'?formCtx.id:nextQuotId('AQ',DB.AQ),session:gv('f-session'),teQtnNo:gv('f-teQtnNo'),teQtnDate:gd('f-teQtnDate'),customerName:gv('f-customerName'),customerRefNo:gv('f-customerRefNo'),kindAttention:gv('f-kindAttention'),enquiryDate:gd('f-enquiryDate'),enquiryDueDate:gd('f-enquiryDueDate'),oemName:gv('f-oemName'),makes:gv('f-makes'),itemDescription:gv('f-itemDescription'),tePORef:gv('f-tePORef'),ourFileNo:gv('f-ourFileNo'),remarks:gv('f-remarks'),orfNo:gv('f-orfNo'),status:gv('f-status')||'Pending'};
    }else if(type==='PO'){
      if(!gv('f-sePONum')&&!gv('f-customerName')){toast('SE PO Num or Customer Name required');return}
      rec={id:mode==='edit'?formCtx.id:nextId('PO',DB.PO),quotId:gv('f-quotId'),quotType:gv('f-quotType'),session:gv('f-session'),sePONum:gv('f-sePONum'),seFileNum:gv('f-seFileNum'),sePOEntryDate:gd('f-sePOEntryDate'),customerName:gv('f-customerName'),customerTenderRef:gv('f-customerTenderRef'),customerPONum:gv('f-customerPONum'),customerPODate:gd('f-customerPODate'),customerDueDate:gd('f-customerDueDate'),poValue:gv('f-poValue'),gemPONum:gv('f-gemPONum'),gemPODate:gd('f-gemPODate'),make:gv('f-make'),itemDescription:gv('f-itemDescription'),oemPONo:gv('f-oemPONo'),oemPODate:gd('f-oemPODate'),oemSONum:gv('f-oemSONum'),gemAMCPayment:gv('f-gemAMCPayment')||'No',gemAMCPaymentAmount:gv('f-gemAMCPaymentAmount'),nmDCSPNum:gv('f-nmDCSPNum'),remarks:gv('f-remarks'),status:gv('f-status')||'Open'};
    }else if(type==='POI'){
      const poId=gv('f-poId');if(!poId){toast('Select a PO');return}
      const po=DB.PO.find(p=>p.id===poId);
      rec={id:mode==='edit'?formCtx.id:nextId('POI',DB.POI),poId,quotId:po?.quotId||'',itemName:gv('f-itemName'),itemDescription:gv('f-itemDescription'),orderedQty:+gv('f-orderedQty')||0,uom:gv('f-uom'),oemDetails:gv('f-oemDetails'),oemInvoiceNo:gv('f-oemInvoiceNo'),oemInvoiceDate:gd('f-oemInvoiceDate'),sePONo:gv('f-sePONo'),seFileNo:gv('f-seFileNo')};
    }else if(type==='OEM'){
      const poiId=gv('f-poiId');if(!poiId||!gv('f-qtyReceived')){toast('Select item and enter qty');return}
      const poi=DB.POI.find(p=>p.id===poiId);
      rec={id:nextId('OEM',DB.OEM),poiId,poId:poi?.poId||'',quotId:poi?.quotId||'',supplier:gv('f-supplier'),itemName:gv('f-itemName')||(poi?.itemName||''),date:gd('f-date')||todayDMY(),qtyReceived:+gv('f-qtyReceived')||0,remarks:gv('f-remarks')};
    }else if(type==='CS'){
      const poiId=gv('f-poiId'),qty=+gv('f-qtySupplied')||0,cust=gv('f-customer');
      if(!poiId||!qty||!cust){toast('Item, qty and customer required');return}
      const poi=DB.POI.find(p=>p.id===poiId);
      const avail=oemRcvd(poiId)-csSupp(poiId);
      if(qty>avail){toast(`Only ${avail} units available`);return}
      rec={id:nextId('CS',DB.CS),poiId,poId:poi?.poId||'',quotId:poi?.quotId||'',oemId:gv('f-oemId'),customer:cust,itemName:gv('f-itemName')||(poi?.itemName||''),date:gd('f-date')||todayDMY(),qtySupplied:qty,remarks:gv('f-remarks')};
    }
    if(mode==='edit')await updateRow(type,rec);else await appendRow(type,rec);
    if(mode==='edit'&&curRec?.id===rec.id)curRec=rec;
    closeModal();toast(`${rec.id} saved`);render();
  }catch(e){toast('Error: '+e.message)}
}

// ── TOAST ──────────────────────────────────────────────────────────────────
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.remove('hide');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('hide'),2600);
}

// ── INIT ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded',()=>{
  loadAllData();
  startAutoRefresh();
});
</script>
